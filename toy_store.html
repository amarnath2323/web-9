<!DOCTYPE html>
<html lang="en" ng-app="toyStoreApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Kids Online Toy Store</title>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular-route.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6ff;color:#26324a}
    header{background:#263b80;color:white;text-align:center;padding:23px 12px}header h1{margin:0;font-size:28px}header p{margin:8px 0 0}
    nav{background:#ffbd59;padding:14px;text-align:center}nav a{color:#26324a;text-decoration:none;font-weight:bold;margin:0 18px}
    nav a:hover{text-decoration:underline}.wrap{max-width:1000px;margin:30px auto;padding:0 16px}.panel{background:white;border-radius:12px;padding:28px;box-shadow:0 5px 18px #0001;min-height:250px}
    h2{text-align:center;color:#263b80;margin-top:0}.center{text-align:center}.hero{font-size:58px;margin:18px 0}
    .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}
    .product{border:1px solid #e0e5f0;border-radius:10px;padding:18px;text-align:center;background:#fff}
    .emoji{font-size:48px}.price{font-weight:bold;color:#16834a}.product button,.action{background:#263b80;color:white;border:0;border-radius:6px;padding:10px 17px;cursor:pointer}
    table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:12px;border:1px solid #d8deeb;text-align:left}th{background:#ffbd59}
    input,select{padding:10px;border:1px solid #bdc7dc;border-radius:6px;margin:7px;max-width:100%}
    .success{color:#16834a;font-weight:bold}.muted{color:#68748d}
    footer{background:#26324a;color:white;text-align:center;padding:13px;margin-top:45px;font-size:13px}
    @media(max-width:600px){nav a{display:inline-block;margin:6px}.panel{padding:18px}table{font-size:13px}}
  </style>
</head>
<body>
<header><h1>🧸 Happy Kids Online Toy Store</h1><p>Play • Learn • Imagine</p></header>
<nav>
  <a href="#!/">Home</a><a href="#!/toys">Toys</a><a href="#!/cart">My Cart</a><a href="#!/contact">Contact</a><a href="register.html">Register</a>
</nav>
<div class="wrap"><div class="panel" ng-view></div></div>
<footer>© 2026 Happy Kids Online Toy Store | All rights reserved</footer>

<script type="text/ng-template" id="home.htm">
  <h2>Welcome to Happy Kids Toy Store!</h2>
  <div class="center"><div class="hero">🧸 🚗 🧩 🪁</div>
    <p>Discover exciting toys that make learning and play more fun.</p>
    <p class="muted">Explore our collection of educational toys, soft toys, puzzles and games.</p>
    <a class="action" href="#!/toys">Explore Toys</a>
  </div>
</script>

<script type="text/ng-template" id="toys.htm">
  <h2>Our Toy Collection</h2>
  <div class="products">
    <div class="product" ng-repeat="toy in toys">
      <div class="emoji">{{toy.icon}}</div><h3>{{toy.name}}</h3>
      <p class="muted">{{toy.description}}</p><p class="price">₹{{toy.price}}</p>
      <button ng-click="addToCart(toy)">Add to Cart</button>
    </div>
  </div>
  <p class="center success" ng-show="message">{{message}}</p>
</script>

<script type="text/ng-template" id="cart.htm">
  <h2>My Shopping Cart</h2>
  <div ng-if="cart.length">
    <table><tr><th>Toy</th><th>Price</th><th>Action</th></tr>
      <tr ng-repeat="item in cart"><td>{{item.name}}</td><td>₹{{item.price}}</td>
        <td><button class="action" ng-click="removeItem($index)">Remove</button></td></tr>
    </table>
    <h3 class="center">Total: ₹{{total()}}</h3>
    <div class="center"><input ng-model="buyer" placeholder="Enter your name"><button class="action" ng-click="placeOrder()" ng-disabled="!buyer">Place Order</button></div>
    <p class="center success" ng-show="ordered">Thank you, {{buyer}}! Your toy order has been placed successfully.</p>
  </div>
  <p class="center muted" ng-if="!cart.length">Your cart is empty. Visit the Toys page to add products.</p>
</script>

<script type="text/ng-template" id="contact.htm">
  <h2>Contact Us</h2>
  <div class="center">
    <p>📍 Happy Kids Online Toy Store, Coimbatore, Tamil Nadu</p>
    <p>📞 +91 98765 43210</p>
    <p>✉️ support@happykidstoys.com</p>
    <p class="muted">For product enquiries and order support, contact our customer care team.</p>
  </div>
</script>

<script>
  var app = angular.module("toyStoreApp", ["ngRoute"]);
  app.config(function($routeProvider) {
    $routeProvider
      .when("/", {templateUrl:"home.htm", controller:"HomeController"})
      .when("/toys", {templateUrl:"toys.htm", controller:"ToysController"})
      .when("/cart", {templateUrl:"cart.htm", controller:"CartController"})
      .when("/contact", {templateUrl:"contact.htm"})
      .otherwise({redirectTo:"/"});
  });
  app.factory("CartService", function() {
    var items = [];
    return {
      items: items,
      add: function(toy) { items.push(toy); },
      remove: function(index) { items.splice(index, 1); }
    };
  });
  app.controller("HomeController", function($scope) {});
  app.controller("ToysController", function($scope, CartService) {
    $scope.toys = [
      {name:"Teddy Bear", description:"Soft and cuddly companion", price:499, icon:"🧸"},
      {name:"Toy Car", description:"Colourful racing car", price:299, icon:"🚗"},
      {name:"Building Blocks", description:"Creative learning blocks", price:399, icon:"🧱"},
      {name:"Jigsaw Puzzle", description:"Fun brain development game", price:249, icon:"🧩"},
      {name:"Kite", description:"Bright outdoor play kite", price:149, icon:"🪁"},
      {name:"Toy Robot", description:"Fun robot play toy", price:599, icon:"🤖"}
    ];
    $scope.message = "";
    $scope.addToCart = function(toy) { CartService.add(toy); $scope.message = toy.name + " added to cart!"; };
  });
  app.controller("CartController", function($scope, CartService) {
    $scope.cart = CartService.items;
    $scope.ordered = false;
    $scope.removeItem = function(index) { CartService.remove(index); };
    $scope.total = function() { return $scope.cart.reduce(function(sum, item) { return sum + item.price; }, 0); };
    $scope.placeOrder = function() { if ($scope.buyer && $scope.cart.length) $scope.ordered = true; };
  });
</script>
</body>
</html>
